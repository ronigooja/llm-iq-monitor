databases:
  monitor:
    source: monitor.db
    allow: false
    allow_sql: false
    tables:
      models: {allow: false}
      prices: {allow: false}
      meta: {allow: false}
      runs: {allow: false}
      run_dims: {allow: false}
      results: {allow: false}
    queries:
      ranking:
        allow: true
        sql: |
          WITH latest AS (
            SELECT r.id AS run_id, r.model, r.effort, r.finished_at,
                   r.dataset_version, r.status,
                    d.dim, d.score, d.quality, d.latency_p50, d.latency_p95,
                   d.ttft_p50, d.time_total, d.n, d.n_err, d.cost_usd,
                   d.cost_per_correct, d.availability,
                   ROW_NUMBER() OVER (
                     PARTITION BY r.model, r.effort
                     ORDER BY r.finished_at DESC, r.id DESC
                   ) AS rn
            FROM runs AS r JOIN run_dims AS d ON d.run_id = r.id
            WHERE r.status NOT IN ('unsupported', 'aborted', 'running')
              AND r.finished_at IS NOT NULL
              AND d.dim = :dim
              AND (:effort = '' OR r.effort = :effort)
          ), ranked AS (
            SELECT *, RANK() OVER (
              ORDER BY CASE WHEN score IS NULL THEN 1 ELSE 0 END,
                       score DESC, latency_p50 ASC
            ) AS score_rank
            FROM latest WHERE rn = 1
          )
          SELECT CASE WHEN score IS NULL THEN NULL ELSE score_rank END AS rank,
                 model, effort, run_id, finished_at, dataset_version, status,
                  availability, score, quality, latency_p50, latency_p95,
                 ttft_p50, time_total, n, n_err, cost_usd, cost_per_correct
          FROM ranked
          ORDER BY CASE WHEN score IS NULL THEN 1 ELSE 0 END,
                   score_rank, model, effort
        params: [dim, effort]
      series:
        allow: true
        sql: |
          SELECT r.finished_at AS t, r.id AS run_id, r.dataset_version,
                  d.score, d.quality, d.latency_p50, d.latency_p95, d.ttft_p50,
                 d.time_total, d.availability,
                 d.cost_per_correct
          FROM runs AS r JOIN run_dims AS d ON d.run_id = r.id
          WHERE r.model = :model AND r.effort = :effort AND d.dim = :dim
            AND r.status NOT IN ('unsupported', 'aborted', 'running')
            AND r.finished_at IS NOT NULL
            AND (:from = '' OR r.finished_at >= CAST(:from AS REAL))
            AND (:to = '' OR r.finished_at <= CAST(:to AS REAL))
            AND (:dataset_version = '' OR r.dataset_version = :dataset_version)
          ORDER BY r.finished_at ASC, r.id ASC
          LIMIT 2000
        params: [model, effort, dim, from, to, dataset_version]
      models:
        allow: true
        sql: |
          WITH finished AS (
            SELECT r.*, ROW_NUMBER() OVER (
              PARTITION BY r.model, r.effort ORDER BY r.finished_at DESC, r.id DESC
            ) AS rn
            FROM runs AS r
            WHERE r.status NOT IN ('unsupported', 'aborted', 'running')
              AND r.finished_at IS NOT NULL
          )
          SELECT f.model, f.effort,
                 m.active,
                 (SELECT group_concat(x.dim, ',') FROM (
                   SELECT DISTINCT d.dim FROM runs rr JOIN run_dims d ON d.run_id = rr.id
                   WHERE rr.model = f.model AND rr.effort = f.effort
                     AND rr.status NOT IN ('unsupported', 'aborted', 'running')
                 ) x) AS dims,
                 f.finished_at AS last_finished_at, f.status AS last_status
          FROM finished f JOIN models m ON m.id = f.model
          WHERE f.rn = 1
          ORDER BY f.model, f.effort
      health:
        allow: true
        sql: |
          SELECT MAX(CASE WHEN status NOT IN ('unsupported', 'aborted', 'running')
                          THEN finished_at END) AS last_finished_at,
                 (SELECT COUNT(*) FROM runs WHERE status = 'running') AS running_runs,
                 (SELECT MAX(fetched_at) FROM prices) AS prices_fetched_at
          FROM runs
settings:
  default_allow_sql: false
  allow_download: false
  default_cache_ttl: 60
  max_returned_rows: 2000

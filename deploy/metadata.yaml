plugins:
  datasette-auth-tokens:
    tokens:
      - token: {$env: RATING_TOKEN}
        actor: {id: rater}
databases:
  monitor:
    source: monitor.db
    allow: false
    allow_sql: false
    tables:
      models: {allow: false}
      prices: {allow: false}
      meta: {allow: false}
      runs: {allow: false}
      run_dims: {allow: false}
      results: {allow: false}
      ui_samples: {allow: false}
      probes: {allow: false}
      probe_state: {allow: false}
      availability_config: {allow: false}
    queries:
      ranking:
        allow: true
        sql: |
           WITH latest AS (
            SELECT r.id AS run_id, r.model, r.effort, r.finished_at,
                   r.dataset_version, r.status,
                    d.dim, d.score, d.quality, d.latency_p50, d.latency_p95,
                   d.ttft_p50, d.time_total, d.n, d.n_err, d.cost_usd,
                    d.cost_per_correct,
                   ROW_NUMBER() OVER (
                     PARTITION BY r.model, r.effort
                     ORDER BY r.finished_at DESC, r.id DESC
                   ) AS rn
            FROM runs AS r JOIN run_dims AS d ON d.run_id = r.id
            WHERE r.status NOT IN ('unsupported', 'aborted', 'running')
              AND r.finished_at IS NOT NULL
              AND d.dim = :dim
              AND (:effort = '' OR r.effort = :effort)
              AND r.dataset_version = (SELECT dataset_version FROM runs ORDER BY started_at DESC, id DESC LIMIT 1)
           ), latest_ui AS (
             SELECT r.model, r.effort, u.prompt_key, u.stars,
                    ROW_NUMBER() OVER (
                      PARTITION BY r.model, r.effort, u.prompt_key
                      ORDER BY u.created_at DESC, u.id DESC
                    ) AS sample_rn
             FROM ui_samples u JOIN runs r ON r.id = u.run_id
             WHERE u.valid = 1 AND u.stars IS NOT NULL
               AND r.dataset_version = (SELECT dataset_version FROM runs ORDER BY started_at DESC, id DESC LIMIT 1)
           ), ui_scores AS (
             SELECT model, effort, AVG(stars) * 10 AS score
             FROM latest_ui WHERE sample_rn = 1
             GROUP BY model, effort
           ), effective AS (
             SELECT l.*, CASE WHEN l.dim = 'ui' THEN us.score ELSE l.score END AS effective_score
             FROM latest l LEFT JOIN ui_scores us ON us.model = l.model AND us.effort = l.effort
             WHERE l.rn = 1
           ), ranked AS (
             SELECT *, RANK() OVER (
               ORDER BY CASE WHEN effective_score IS NULL THEN 1 ELSE 0 END,
                        effective_score DESC, latency_p50 ASC
             ) AS score_rank
             FROM effective
           )
           SELECT CASE WHEN effective_score IS NULL THEN NULL ELSE score_rank END AS rank,
                  model, effort, run_id, finished_at, dataset_version, status,
                    effective_score AS score, quality, latency_p50, latency_p95,
                 ttft_p50, time_total, n, n_err, cost_usd, cost_per_correct
           FROM ranked
           ORDER BY CASE WHEN effective_score IS NULL THEN 1 ELSE 0 END,
                   score_rank, model, effort
        params: [dim, effort]
      best:
        allow: true
        sql: |
          WITH RECURSIVE
          input AS (
            SELECT
              CASE
                WHEN trim(COALESCE(:score_tolerance, '')) <> ''
                 AND trim(:score_tolerance) NOT GLOB '*[^0-9.]*'
                 AND trim(:score_tolerance) GLOB '*[0-9]*'
                 AND length(trim(:score_tolerance)) - length(replace(trim(:score_tolerance), '.', '')) <= 1
                THEN CAST(trim(:score_tolerance) AS REAL)
                ELSE 0.0
              END AS score_tolerance,
              CASE
                WHEN trim(COALESCE(:price_tolerance, '')) <> ''
                 AND trim(:price_tolerance) NOT GLOB '*[^0-9.]*'
                 AND trim(:price_tolerance) GLOB '*[0-9]*'
                 AND length(trim(:price_tolerance)) - length(replace(trim(:price_tolerance), '.', '')) <= 1
                THEN CAST(trim(:price_tolerance) AS REAL)
                ELSE 30.0
              END AS price_tolerance,
              COALESCE(:exclude, '') AS exclude_text,
              COALESCE(:exclude_reasoning, '') AS exclude_reasoning_text,
              COALESCE(:exclude_code, '') AS exclude_code_text,
              COALESCE(:exclude_instruction, '') AS exclude_instruction_text,
              COALESCE(:exclude_write_zh, '') AS exclude_write_zh_text,
              COALESCE(:exclude_write_en, '') AS exclude_write_en_text,
              COALESCE(:exclude_ui, '') AS exclude_ui_text,
              CASE WHEN trim(COALESCE(:min_availability, '')) <> ''
                    AND trim(:min_availability) NOT GLOB '*[^0-9.]*'
                    AND trim(:min_availability) GLOB '*[0-9]*'
                    AND length(trim(:min_availability)) - length(replace(trim(:min_availability), '.', '')) <= 1
                   THEN CAST(trim(:min_availability) AS REAL) ELSE 0.9 END AS min_availability
           ), exclude_parts(keyword, rest) AS (
            SELECT trim(substr(exclude_text, 1, instr(exclude_text || ',', ',') - 1)),
                   substr(exclude_text || ',', instr(exclude_text || ',', ',') + 1)
            FROM input
            UNION ALL
            SELECT trim(substr(rest, 1, instr(rest, ',') - 1)), substr(rest, instr(rest, ',') + 1)
            FROM exclude_parts
            WHERE rest <> ''
          ), exclude_reasoning_parts(keyword, rest) AS (
            SELECT trim(substr(exclude_reasoning_text, 1, instr(exclude_reasoning_text || ',', ',') - 1)),
                   substr(exclude_reasoning_text || ',', instr(exclude_reasoning_text || ',', ',') + 1)
            FROM input
            UNION ALL
            SELECT trim(substr(rest, 1, instr(rest, ',') - 1)), substr(rest, instr(rest, ',') + 1)
            FROM exclude_reasoning_parts
            WHERE rest <> ''
          ), exclude_code_parts(keyword, rest) AS (
            SELECT trim(substr(exclude_code_text, 1, instr(exclude_code_text || ',', ',') - 1)),
                   substr(exclude_code_text || ',', instr(exclude_code_text || ',', ',') + 1)
            FROM input
            UNION ALL
            SELECT trim(substr(rest, 1, instr(rest, ',') - 1)), substr(rest, instr(rest, ',') + 1)
            FROM exclude_code_parts
            WHERE rest <> ''
          ), exclude_instruction_parts(keyword, rest) AS (
            SELECT trim(substr(exclude_instruction_text, 1, instr(exclude_instruction_text || ',', ',') - 1)),
                   substr(exclude_instruction_text || ',', instr(exclude_instruction_text || ',', ',') + 1)
            FROM input
            UNION ALL
            SELECT trim(substr(rest, 1, instr(rest, ',') - 1)), substr(rest, instr(rest, ',') + 1)
            FROM exclude_instruction_parts
            WHERE rest <> ''
          ), exclude_write_zh_parts(keyword, rest) AS (
            SELECT trim(substr(exclude_write_zh_text, 1, instr(exclude_write_zh_text || ',', ',') - 1)),
                   substr(exclude_write_zh_text || ',', instr(exclude_write_zh_text || ',', ',') + 1)
            FROM input
            UNION ALL
            SELECT trim(substr(rest, 1, instr(rest, ',') - 1)), substr(rest, instr(rest, ',') + 1)
            FROM exclude_write_zh_parts
            WHERE rest <> ''
          ), exclude_write_en_parts(keyword, rest) AS (
            SELECT trim(substr(exclude_write_en_text, 1, instr(exclude_write_en_text || ',', ',') - 1)),
                   substr(exclude_write_en_text || ',', instr(exclude_write_en_text || ',', ',') + 1)
            FROM input
            UNION ALL
            SELECT trim(substr(rest, 1, instr(rest, ',') - 1)), substr(rest, instr(rest, ',') + 1)
            FROM exclude_write_en_parts
            WHERE rest <> ''
          ), exclude_ui_parts(keyword, rest) AS (
            SELECT trim(substr(exclude_ui_text, 1, instr(exclude_ui_text || ',', ',') - 1)),
                   substr(exclude_ui_text || ',', instr(exclude_ui_text || ',', ',') + 1)
            FROM input
            UNION ALL
            SELECT trim(substr(rest, 1, instr(rest, ',') - 1)), substr(rest, instr(rest, ',') + 1)
            FROM exclude_ui_parts
            WHERE rest <> ''
           ),
           dimensions AS (
            SELECT 'reasoning' AS dim, 'Reasoning' AS name, 'Multi-step logic and calculation (ordering, probability, calendar), reading tables, avoiding traps, admitting when the answer is unknown' AS use_when
            UNION ALL SELECT 'code', 'Code', 'Writing algorithmic functions and fixing bugs'
            UNION ALL SELECT 'instruction', 'Instruction following', 'Following a strict output format under several rules at once, extracting fields into JSON'
            UNION ALL SELECT 'write_zh', 'Writing · 中文', 'Chinese writing under explicit constraints: replies, notices, summaries, guides, stories, essays, promotional copy'
            UNION ALL SELECT 'write_en', 'Writing · English', 'English writing under explicit constraints: replies, notices, summaries, guides, stories, essays, promotional copy'
            UNION ALL SELECT 'ui', 'Drawing (SVG)', 'Drawing an illustration as SVG'
          ), latest AS (
            SELECT r.id AS run_id, r.model, r.effort, r.finished_at,
                   r.dataset_version, r.status,
                   d.dim, d.score, d.quality, d.latency_p50, d.cost_per_correct,
                    
                   ROW_NUMBER() OVER (
                     PARTITION BY r.model, r.effort, d.dim
                     ORDER BY r.finished_at DESC, r.id DESC
                   ) AS rn
            FROM runs AS r JOIN run_dims AS d ON d.run_id = r.id
            CROSS JOIN input
            WHERE r.status NOT IN ('unsupported', 'aborted', 'running')
              AND r.finished_at IS NOT NULL
              AND d.dim IN (SELECT dim FROM dimensions)
              AND r.dataset_version = (SELECT dataset_version FROM runs ORDER BY started_at DESC, id DESC LIMIT 1)
          ), latest_ui AS (
            SELECT r.model, r.effort, u.prompt_key, u.stars,
                   ROW_NUMBER() OVER (
                     PARTITION BY r.model, r.effort, u.prompt_key
                     ORDER BY u.created_at DESC, u.id DESC
                   ) AS sample_rn
            FROM ui_samples u JOIN runs r ON r.id = u.run_id
            WHERE u.valid = 1 AND u.stars IS NOT NULL
              AND r.dataset_version = (SELECT dataset_version FROM runs ORDER BY started_at DESC, id DESC LIMIT 1)
          ), ui_scores AS (
            SELECT model, effort, AVG(stars) * 10 AS score
            FROM latest_ui WHERE sample_rn = 1
            GROUP BY model, effort
          ), candidates AS (
            SELECT l.run_id, l.model, l.effort, l.finished_at, l.dataset_version,
                    l.dim, l.quality, l.latency_p50, l.cost_per_correct,
                   CASE WHEN l.dim = 'ui' THEN us.score ELSE l.score END AS score
            FROM latest l LEFT JOIN ui_scores us ON us.model = l.model AND us.effort = l.effort
            WHERE l.rn = 1
          ), filtered AS (
             SELECT c.*
             FROM candidates c CROSS JOIN input
             WHERE c.score IS NOT NULL
             AND (input.min_availability = 0 OR NOT EXISTS (
                 SELECT 1 FROM probes a WHERE a.model=c.model AND a.effort=c.effort
                 GROUP BY a.model,a.effort HAVING COUNT(*) >= COALESCE((SELECT min_samples FROM availability_config), 3)
                   AND AVG(a.ok) < input.min_availability
               ))
              AND NOT EXISTS (
               SELECT 1 FROM exclude_parts e
                 WHERE e.keyword <> '' AND instr(lower(c.model), lower(e.keyword)) > 0
               )
               AND NOT EXISTS (
                 SELECT 1 FROM exclude_reasoning_parts e
                 WHERE c.dim = 'reasoning' AND e.keyword <> '' AND instr(lower(c.model), lower(e.keyword)) > 0
               )
               AND NOT EXISTS (
                 SELECT 1 FROM exclude_code_parts e
                 WHERE c.dim = 'code' AND e.keyword <> '' AND instr(lower(c.model), lower(e.keyword)) > 0
               )
               AND NOT EXISTS (
                 SELECT 1 FROM exclude_instruction_parts e
                 WHERE c.dim = 'instruction' AND e.keyword <> '' AND instr(lower(c.model), lower(e.keyword)) > 0
               )
               AND NOT EXISTS (
                 SELECT 1 FROM exclude_write_zh_parts e
                 WHERE c.dim = 'write_zh' AND e.keyword <> '' AND instr(lower(c.model), lower(e.keyword)) > 0
               )
               AND NOT EXISTS (
                 SELECT 1 FROM exclude_write_en_parts e
                 WHERE c.dim = 'write_en' AND e.keyword <> '' AND instr(lower(c.model), lower(e.keyword)) > 0
               )
               AND NOT EXISTS (
                 SELECT 1 FROM exclude_ui_parts e
                 WHERE c.dim = 'ui' AND e.keyword <> '' AND instr(lower(c.model), lower(e.keyword)) > 0
               )
          ), score_limit AS (
            SELECT f.*, MAX(f.score) OVER (PARTITION BY f.dim) AS max_score,
                   input.score_tolerance, input.price_tolerance
            FROM filtered f CROSS JOIN input
          ), score_kept AS (
            SELECT * FROM score_limit
            WHERE score >= max_score - score_tolerance
          ), price_limits AS (
            SELECT s.*, MIN(s.cost_per_correct) OVER (PARTITION BY s.dim) AS min_price,
                   MAX(CASE WHEN s.cost_per_correct IS NOT NULL THEN 1 ELSE 0 END)
                     OVER (PARTITION BY s.dim) AS has_price
            FROM score_kept s
          ), price_kept AS (
            SELECT * FROM price_limits
            WHERE has_price = 0
               OR (cost_per_correct IS NOT NULL
                   AND cost_per_correct <= min_price * (1 + price_tolerance / 100.0))
          ), chosen AS (
            SELECT p.*, ROW_NUMBER() OVER (
              PARTITION BY p.dim
              ORDER BY CASE WHEN p.latency_p50 IS NULL THEN 1 ELSE 0 END,
                       p.latency_p50, p.model, p.effort
            ) AS choice_rn
            FROM price_kept p
          )
          SELECT d.dim, d.use_when, c.model, c.effort
          FROM dimensions d LEFT JOIN chosen c ON c.dim = d.dim AND c.choice_rn = 1
          ORDER BY CASE d.dim
            WHEN 'reasoning' THEN 1 WHEN 'code' THEN 2 WHEN 'instruction' THEN 3
            WHEN 'write_zh' THEN 4 WHEN 'write_en' THEN 5 WHEN 'ui' THEN 6
          END
        params: [score_tolerance, price_tolerance, min_availability, exclude, exclude_reasoning, exclude_code, exclude_instruction, exclude_write_zh, exclude_write_en, exclude_ui]
      availability_now:
        allow: true
        sql: |
          WITH points AS (
            SELECT p.model, p.effort, p.t, p.ok, p.latency_s,
                   MAX(p.t, strftime('%s','now') - c.window_min * 60.0) AS left_t,
                   MIN(COALESCE(LEAD(p.t) OVER (PARTITION BY p.model,p.effort ORDER BY p.t), strftime('%s','now')), strftime('%s','now')) AS right_t
            FROM probes p CROSS JOIN availability_config c
            WHERE p.t >= strftime('%s','now') - c.window_min * 60.0
          ),
          weighted AS (
            SELECT model, effort, COUNT(*) AS samples,
                   SUM((right_t-left_t)*ok) / NULLIF(SUM(right_t-left_t), 0) AS availability,
                   MAX(t) AS last_probe_at
            FROM points GROUP BY model, effort
          ),
          successful AS (
            SELECT model, effort, latency_s,
                   ROW_NUMBER() OVER (PARTITION BY model,effort ORDER BY latency_s) AS rn,
                   COUNT(*) OVER (PARTITION BY model,effort) AS n
            FROM points WHERE ok=1 AND latency_s IS NOT NULL
          ), medians AS (
            SELECT model, effort, AVG(latency_s) AS latency_p50
            FROM successful WHERE rn IN ((n+1)/2, (n+2)/2) GROUP BY model, effort
          )
          SELECT w.model, w.effort,
                 CASE WHEN w.samples >= (SELECT min_samples FROM availability_config) THEN w.availability END AS availability,
                 w.samples, COALESCE(s.state, 'unknown') AS state, m.latency_p50, w.last_probe_at
          FROM weighted w LEFT JOIN probe_state s ON s.model=w.model AND s.effort=w.effort
          LEFT JOIN medians m ON m.model=w.model AND m.effort=w.effort
          ORDER BY w.model, CASE w.effort WHEN 'low' THEN 1 WHEN 'medium' THEN 2 WHEN 'high' THEN 3 END
        params: []
      availability_history:
        allow: true
        sql: |
          WITH RECURSIVE nums(n) AS (
            SELECT 0 UNION ALL SELECT n+1 FROM nums WHERE n < 29
          ), input AS (
            SELECT CASE WHEN CAST(:days AS INTEGER) BETWEEN 1 AND 30 THEN CAST(:days AS INTEGER) ELSE 1 END AS days
          ), runtime AS (
            SELECT COALESCE((SELECT now FROM availability_runtime LIMIT 1), CAST(strftime('%s','now') AS REAL)) AS now,
                   COALESCE((SELECT interval_s FROM availability_runtime LIMIT 1), 3600.0) AS interval_s
          ), bounds AS (
            SELECT days, CASE WHEN days=1 THEN 3600.0 ELSE 86400.0 END AS width,
                   CAST(now / CASE WHEN days=1 THEN 3600.0 ELSE 86400.0 END AS INTEGER)
                     * CASE WHEN days=1 THEN 3600.0 ELSE 86400.0 END AS current_start,
                   now, interval_s FROM input CROSS JOIN runtime
          ), buckets AS (
            SELECT current_start - ((CASE WHEN days=1 THEN 23 ELSE days-1 END - nums.n) * width) AS bucket_start, width, now, interval_s
            FROM bounds CROSS JOIN nums
            WHERE nums.n < CASE WHEN days=1 THEN 24 ELSE days END
          ), targets AS (
            SELECT DISTINCT model, effort FROM probes WHERE (:model='' OR model=:model) AND (:effort='' OR effort=:effort)
          ), points AS (
            SELECT p.model,p.effort,p.t,p.ok,
                   COALESCE(LEAD(p.t) OVER (PARTITION BY p.model,p.effort ORDER BY p.t), b.now) AS next_t,
                   b.now, b.interval_s
            FROM probes p CROSS JOIN (SELECT now, interval_s FROM bounds) b
            WHERE (:model='' OR p.model=:model) AND (:effort='' OR p.effort=:effort)
          )
          SELECT t.model,t.effort,b.bucket_start,
                 CASE WHEN SUM(MAX(0, MIN(b.bucket_start+b.width, p.next_t, p.t+2*p.interval_s, p.now) - MAX(b.bucket_start,p.t))) > 0
                      THEN SUM(MAX(0, MIN(b.bucket_start+b.width, p.next_t, p.t+2*p.interval_s, p.now) - MAX(b.bucket_start,p.t))*p.ok) /
                           SUM(MAX(0, MIN(b.bucket_start+b.width, p.next_t, p.t+2*p.interval_s, p.now) - MAX(b.bucket_start,p.t))) END AS availability,
                 SUM(CASE WHEN p.t >= b.bucket_start AND p.t < b.bucket_start+b.width THEN 1 ELSE 0 END) AS samples
          FROM targets t CROSS JOIN buckets b LEFT JOIN points p ON p.model=t.model AND p.effort=t.effort
             AND p.next_t > b.bucket_start AND p.t < b.bucket_start+b.width
          GROUP BY t.model,t.effort,b.bucket_start ORDER BY t.model,t.effort,b.bucket_start
        params: [model, effort, days]
      series:
        allow: true
        sql: |
           SELECT r.finished_at AS t, r.id AS run_id, r.dataset_version,
                  d.score, d.quality, d.latency_p50, d.latency_p95, d.ttft_p50,
                  d.time_total,
                 d.cost_per_correct
           FROM runs AS r JOIN run_dims AS d ON d.run_id = r.id
           WHERE r.model = :model AND r.effort = :effort AND d.dim = :dim
            AND r.status NOT IN ('unsupported', 'aborted', 'running')
            AND r.finished_at IS NOT NULL
            AND (:from = '' OR r.finished_at >= CAST(:from AS REAL))
            AND (:to = '' OR r.finished_at <= CAST(:to AS REAL))
            AND (:dataset_version = '' OR r.dataset_version = :dataset_version)
           AND :dim != 'ui'
           UNION ALL
           SELECT u.rated_at AS t, u.run_id, r.dataset_version,
                  u.stars * 10 AS score, NULL AS quality, d.latency_p50,
                   d.latency_p95, d.ttft_p50, d.time_total,
                  d.cost_per_correct
           FROM ui_samples u JOIN runs r ON r.id = u.run_id
             JOIN run_dims d ON d.run_id = r.id AND d.dim = 'ui'
           WHERE :dim = 'ui' AND r.model = :model AND r.effort = :effort
             AND u.valid = 1 AND u.stars IS NOT NULL AND u.rated_at IS NOT NULL
             AND r.status NOT IN ('unsupported', 'aborted', 'running')
             AND (:from = '' OR u.rated_at >= CAST(:from AS REAL))
             AND (:to = '' OR u.rated_at <= CAST(:to AS REAL))
             AND (:dataset_version = '' OR r.dataset_version = :dataset_version)
           ORDER BY t ASC, run_id ASC
           LIMIT 2000
        params: [model, effort, dim, from, to, dataset_version]
      models:
        allow: true
        sql: |
          WITH finished AS (
            SELECT r.*, ROW_NUMBER() OVER (
              PARTITION BY r.model, r.effort ORDER BY r.finished_at DESC, r.id DESC
            ) AS rn
            FROM runs AS r
            WHERE r.status NOT IN ('unsupported', 'aborted', 'running')
              AND r.finished_at IS NOT NULL
              AND r.dataset_version = (SELECT dataset_version FROM runs ORDER BY started_at DESC, id DESC LIMIT 1)
          )
          SELECT f.model, f.effort,
                 m.active,
                 (SELECT group_concat(x.dim, ',') FROM (
                   SELECT DISTINCT d.dim FROM runs rr JOIN run_dims d ON d.run_id = rr.id
                   WHERE rr.model = f.model AND rr.effort = f.effort
                     AND rr.status NOT IN ('unsupported', 'aborted', 'running')
                     AND rr.dataset_version = f.dataset_version
                 ) x) AS dims,
                 f.finished_at AS last_finished_at, f.status AS last_status
          FROM finished f JOIN models m ON m.id = f.model
          WHERE f.rn = 1
          ORDER BY f.model, f.effort
      health:
        allow: true
        sql: |
          SELECT MAX(CASE WHEN status NOT IN ('unsupported', 'aborted', 'running')
                          THEN finished_at END) AS last_finished_at,
                 (SELECT COUNT(*) FROM runs WHERE status = 'running') AS running_runs,
                 (SELECT MAX(fetched_at) FROM prices) AS prices_fetched_at,
                 (SELECT dataset_version FROM runs ORDER BY started_at DESC, id DESC LIMIT 1) AS dataset_version
           FROM runs
      dimensions:
        allow: true
        sql: |
          SELECT 'reasoning' AS dim, 'Reasoning' AS name, 'Multi-step logic and calculation (ordering, probability, calendar), reading tables, avoiding traps, admitting when the answer is unknown' AS use_when, 'answer' AS kind
          UNION ALL SELECT 'code', 'Code', 'Writing algorithmic functions and fixing bugs', 'code'
          UNION ALL SELECT 'instruction', 'Instruction following', 'Following a strict output format under several rules at once, extracting fields into JSON', 'text'
           UNION ALL SELECT 'write_zh', 'Writing · 中文', 'Chinese writing under explicit constraints: replies, notices, summaries, guides, stories, essays, promotional copy', 'text'
           UNION ALL SELECT 'write_en', 'Writing · English', 'English writing under explicit constraints: replies, notices, summaries, guides, stories, essays, promotional copy', 'text'
          UNION ALL SELECT 'ui', 'Drawing (SVG)', 'Drawing an illustration as SVG', 'svg'
      ui_samples:
        allow: true
        sql: |
          SELECT u.id AS sample_id, r.model, r.effort, u.prompt_key, u.prompt,
                 u.svg, u.valid, u.stars, u.created_at
          FROM ui_samples u JOIN runs r ON r.id = u.run_id
          WHERE (:model = '' OR r.model = :model)
            AND (:effort = '' OR r.effort = :effort)
          ORDER BY u.created_at DESC, u.id DESC
          LIMIT 200
        params: [model, effort]
      whoami:
        allow: {id: rater}
        sql: SELECT 1 AS ok
      rate:
        allow: {id: rater}
        write: true
        sql: |
          UPDATE ui_samples
          SET stars = CAST(:stars AS INTEGER), rated_at = strftime('%s','now')
          WHERE id = CAST(:sample_id AS INTEGER) AND valid = 1 AND svg IS NOT NULL
            AND CAST(:stars AS INTEGER) BETWEEN 1 AND 10
        params: [sample_id, stars]
settings:
  default_allow_sql: false
  allow_download: false
  default_cache_ttl: 60
  max_returned_rows: 2000
